# =============================================================================
#  ROHAFYA HEALTH — stack Portainer CE
#  Portainer : Stacks > + Add stack > Web editor > coller ce fichier.
#
#  Toutes les valeurs variables se règlent dans la section « Environment variables »
#  de la stack (modèle : rohafya-health-stack.env.example).
#  Changer ROHAFYA_HEALTH_VERSION puis « Update the stack » + « Re-pull image and redeploy »
#  = déployer une nouvelle version OU revenir à une ancienne (rollback).
# =============================================================================

services:
  rohafya-health:
    # Version TOUJOURS explicite (ex. 1.0.0) : jamais « latest » en production,
    # sinon impossible de savoir ce qui tourne ni de revenir en arrière.
    image: ${ROHAFYA_HEALTH_IMAGE:-ghcr.io/manuelze/rohafya-health}:${ROHAFYA_HEALTH_VERSION}
    container_name: rohafya-health-${ROHAFYA_HEALTH_ENV:-production}
    restart: unless-stopped

    environment:
      # URL de l'API Flask appelée par le navigateur (même API que ROHAFYA : saas/public/trial-requests).
      API_URL: https://api.rohafya.com/
      # production | preprod : seule la production est ouverte aux moteurs de recherche (robots.txt, sitemap).
      ROHAFYA_ENV: ${ROHAFYA_HEALTH_ENV:-production}
      # Noms de domaine autorisés à atteindre le rendu serveur (protection SSRF), séparés par des virgules.
      NG_ALLOWED_HOSTS: "health.rohafya.com"
      # En-têtes transmis par le reverse proxy (Nginx Proxy Manager).
      NG_TRUST_PROXY_HEADERS: x-forwarded-host,x-forwarded-proto,x-forwarded-for
      PORT: "4100"
      TZ: ${TZ:-Africa/Douala}

    # Publié UNIQUEMENT sur l'interface locale du serveur : utile pour les vérifications
    # (curl http://127.0.0.1:4100/healthz depuis le serveur). Le trafic public passe par
    # Nginx Proxy Manager via le réseau Docker « proxy ».
    # ATTENTION : Docker contourne le pare-feu UFW pour les ports publiés sur 0.0.0.0.
    ports:
      - "9874:4100"

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4100/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    # Garde-fous : un incident applicatif ne doit pas faire tomber le serveur.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M

    # Durcissement : système de fichiers en lecture seule, aucun privilège.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # Journaux bornés : sans cela, les logs Docker peuvent remplir le disque.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    labels:
      com.pdmdsante.app: "rohafya-health"
      com.pdmdsante.env: "${ROHAFYA_HEALTH_ENV:-production}"
      com.pdmdsante.version: "${ROHAFYA_HEALTH_VERSION}"

    networks:
      - proxy

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 10.117.0.0/16
